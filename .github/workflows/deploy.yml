name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t ledgerguard-backend ./backend
      - name: Build frontend image
        run: docker build -t ledgerguard-frontend ./frontend
