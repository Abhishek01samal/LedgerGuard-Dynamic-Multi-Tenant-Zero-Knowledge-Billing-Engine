name: CI

on:
  pull_request:
    branches: [main, develop, sdilleswari]
  push:
    branches: [main, develop, sdilleswari]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Format & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No secrets or build output tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|\.key$|(^|/)node_modules/|(^|/)dist/' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Forbidden files are tracked by git:"
            echo "$bad"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - name: Prettier
        run: npm run format:check

  backend:
    name: Backend (typecheck, lint, tests with MongoDB + Redis, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # MongoDB (single-node replica set rs0, needed for transactions) and Redis.
      - name: Start MongoDB replica set and Redis
        working-directory: .
        run: docker compose up -d --wait

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests (ledger, idempotency, transactions, concurrency)
        run: npm run test:integration -- --json --outputFile=jest-integration.json
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/ledgerguard_test_master?replicaSet=rs0
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
      - name: Build
        run: npm run build

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence
          path: backend/jest-integration.json
          if-no-files-found: ignore

      - name: Show container logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs --no-color --tail=100

      - name: Stop services
        if: always()
        working-directory: .
        run: docker compose down -v

  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend
        id: detect
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No frontend/package.json yet - skipping."; fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: steps.detect.outputs.present == 'true'
        run: npm ci
      - if: steps.detect.outputs.present == 'true'
        run: npm run typecheck --if-present
      - if: steps.detect.outputs.present == 'true'
        run: npm run lint --if-present
      - if: steps.detect.outputs.present == 'true'
        run: npm run build
